[package]
name = "zap_sftp"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32"] }
openssl-sys = { version = "*", features = ["vendored"] }
smol = "2"
thiserror = "2"
base64 = { workspace = true }
dirs = { workspace = true }
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
